<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Video Player</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0b0f;
            font-family: Arial, sans-serif;
            color: white;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .footer {
            margin-top: 16px;
            color: #888;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Video</h1>

        <div class="video-wrapper">
            <iframe
                src="https://drive.google.com/file/d/YOUR_FILE_ID/preview"
                allow="autoplay; fullscreen"
                allowfullscreen>
            </iframe>
        </div>

        <div class="footer">
            Video player
        </div>
    </main>
</body>
</html>
